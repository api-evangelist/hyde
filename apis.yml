name: Hyde
description: 'Hyde is an enterprise AI platform that partners with organizations to turn their proprietary
  data and institutional expertise into specialized reasoning models. Its integrated workbench spans environment
  and data preparation, a synthetic data engine for building simulation training environments, GPU-optimized
  training pipelines, trajectory engineering, and a tightly coupled inference-training loop for continuous
  improvement. Hyde positions custom, domain-specific models that keep enterprise data private while claiming
  superior agent accuracy and up to 10x lower inference cost and latency versus frontier models. It is a
  sales-led enterprise engagement (portfolio company of bain-capital-ventures and general-catalyst) that does
  not currently publish a public developer API, SDK, or developer portal.'
